name: Comprobaciones

# Se ejecuta en cada PR y en cada push a main: tipos, lint, formato, tests y build.
# El despliegue lo hace Cloudflare (Workers Builds) al conectar el repo; ver README.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
